name: Android CI - EDPatch (app + patchapp)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'readme/**'
      - '**.txt'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      # ================== BUILD DEBUG ==================
#      - name: Build Debug - app
#        run: ./gradlew :app:assembleDebug --stacktrace

      # Copy app Debug APK as patcher.apk ke assets patchapp SEBELUM patchapp debug dibuild,
      # supaya patcher.apk ikut ter-bundle di dalam APK patchapp.
      # File ini hanya ada di sandbox/workspace runner, tidak disimpan permanen ke repo.
#      - name: Copy app Debug APK as patcher.apk (into patchapp debug assets)
#        run: |
#          mkdir -p patchapp/assets/patcher/debug
#          cp app/build/outputs/apk/debug/app-debug.apk patchapp/assets/patcher/debug/patcher.apk

#      - name: Build Debug - patchapp
#        run: ./gradlew :patchapp:assembleDebug --stacktrace

      # ================== BUILD RELEASE ==================
      - name: Build Release - app
        run: ./gradlew :app:assembleRelease --stacktrace

      # Copy app Release APK as patcher.apk ke assets patchapp SEBELUM patchapp release dibuild,
      # supaya patcher.apk ikut ter-bundle di dalam APK patchapp.
      # File ini hanya ada di sandbox/workspace runner, tidak disimpan permanen ke repo.
      - name: Copy app Release APK as patcher.apk (into patchapp release assets)
        run: |
          mkdir -p patchapp/assets/patcher/release
          cp app/build/outputs/apk/release/app-release.apk patchapp/assets/patcher/release/patcher.apk

      - name: Build Release - patchapp
        run: ./gradlew :patchapp:assembleRelease --stacktrace

      # ================== UPLOAD ARTIFACTS ==================
#      - name: Upload app Debug APK
#        uses: actions/upload-artifact@v4
#        with:
#          name: app-Debug
#          path: app/build/outputs/apk/debug/*.apk
#          if-no-files-found: warn

      # patchapp debug (sudah berisi patcher.apk) diupload dengan nama edpatch-debug
#      - name: Upload edpatch-debug APK
#        uses: actions/upload-artifact@v4
#        with:
#          name: edpatch-debug
#          path: patchapp/build/outputs/apk/debug/*.apk
#          if-no-files-found: warn

      - name: Upload app Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      # patchapp release (sudah berisi patcher.apk) diupload dengan nama edpatch-release
      - name: Upload edpatch-release APK
        uses: actions/upload-artifact@v4
        with:
          name: edpatch-release
          path: patchapp/build/outputs/apk/release/*.apk
          if-no-files-found: warn
